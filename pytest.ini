[pytest]
# --capture=fd (pytest's default) redirects real OS file descriptors 1/2.
# That collides with tkinter/Tcl on Windows: creating a second Tk() in the
# same process (tests/test_ui.py has two tests, both constructing App())
# intermittently fails with "Can't find a usable tk.tcl" / "couldn't read
# file .../ttk/<something>.tcl" -- a different file each time, which is the
# tell that the files themselves are fine (confirmed: all present, normal
# sizes) and it's Tcl's file read colliding with the fd-level redirection,
# not a broken Tcl/Tk install. --capture=sys only swaps Python's sys.stdout/
# sys.stderr objects (no real fd redirection) and does not reproduce this in
# repeated local runs, while still suppressing output on passing tests.
addopts = --capture=sys
